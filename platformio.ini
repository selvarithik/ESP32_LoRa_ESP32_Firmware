[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
extra_scripts = post:tools/link_optimization.py
; Source-only capacity migration: do not flash this changed table without backup/recovery approval.
; 4 MB huge_app removes app1 and moves/shrinks SPIFFS; NVS offsets unchanged.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

; Size-optimized application; serial logging remains enabled below.
build_type = release
lib_ldf_mode = chain+

lib_deps =
    https://github.com/avishorp/TM1637.git#v1.2.0
    bblanchon/ArduinoJson@7.4.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15

build_flags =
    -flto
    ; Small command/ACK documents should not each reserve a 4 KiB JSON pool.
    ; Larger documents grow across pools; wire limits and schemas stay unchanged.
    -DARDUINOJSON_POOL_CAPACITY=64
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=12288

[env:esp32_master]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}

[env:esp32_slave]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
