[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
extra_scripts = post:tools/link_optimization.py
; Preserve deployed partition offsets; evaluate build capacity before upload.
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 921600

; Size-optimized application; serial logging remains enabled below.
build_type = release
lib_ldf_mode = chain+

lib_deps =
    https://github.com/avishorp/TM1637.git#v1.2.0
    bblanchon/ArduinoJson@7.4.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15

build_flags =
    -flto
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=12288
